<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Открыть контакт</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: min(100%, 460px);
      padding: 28px 22px 24px;
      border: 1px solid #e4e4e7;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(0 0 0 / 8%);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #6e6e73;
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 8vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.025em;
    }
    .explanation {
      margin: 16px 0 24px;
      color: #515154;
      font-size: 17px;
      line-height: 1.45;
    }
    button, .secondary {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      font: inherit;
      font-size: 17px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button {
      border: 0;
      background: #1d1d1f;
      color: #fff;
    }
    button:active { transform: scale(0.99); }
    button:disabled { cursor: wait; opacity: 0.65; }
    .secondary {
      display: grid;
      place-items: center;
      margin-top: 10px;
      border: 1px solid #d2d2d7;
      color: #1d1d1f;
      text-decoration: none;
    }
    .status {
      min-height: 22px;
      margin: 14px 2px 0;
      color: #515154;
      font-size: 14px;
      line-height: 1.4;
    }
    .manual {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #e4e4e7;
    }
    .manual label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      background: #fafafa;
      color: #1d1d1f;
      font: 14px/1.45 inherit;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow" id="destination-label">Контакт</p>
    <h1 id="title">Подготавливаем контакт</h1>
    <p class="explanation" id="explanation">Текст будет скопирован перед переходом.</p>
    <div id="actions" hidden>
      <button id="copy-open" type="button">Скопировать и открыть</button>
      <a class="secondary" id="open-only" rel="noreferrer">Открыть без копирования</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="manual" id="manual" hidden>
      <label for="message">Если копирование заблокировано, скопируйте текст вручную</label>
      <textarea id="message" readonly></textarea>
    </div>
  </main>
  <script>
    (() => {
      "use strict";

      const PUBLIC_KEY_JWK = globalThis.CONTACT_LAUNCHER_PUBLIC_JWK || {
        kty: "EC",
        crv: "P-256",
        x: "zi_SYd5xjwp7kDYP8jva3D-fFekUA9TR3CpNm4Qj8E8",
        y: "A8c0xBHa5YOD8BqMI0Kg548U8xrofILRsRwPEGhHS1U",
        ext: true
      };
      const ALLOWED_HTTPS_HOSTS = new Set([
        "telegram.me", "www.telegram.me", "t.me", "www.t.me",
        "instagram.com", "www.instagram.com",
        "tiktok.com", "www.tiktok.com",
        "wa.me", "api.whatsapp.com", "web.whatsapp.com"
      ]);
      const elements = {
        title: document.querySelector("#title"),
        explanation: document.querySelector("#explanation"),
        destinationLabel: document.querySelector("#destination-label"),
        actions: document.querySelector("#actions"),
        copyOpen: document.querySelector("#copy-open"),
        openOnly: document.querySelector("#open-only"),
        status: document.querySelector("#status"),
        manual: document.querySelector("#manual"),
        message: document.querySelector("#message")
      };

      function fail(message) {
        elements.title.textContent = "Ссылка не работает";
        elements.explanation.textContent = message;
        elements.status.textContent = "Вернитесь в список контактов и попробуйте снова.";
      }

      function decodeBase64Url(encoded) {
        const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        return Uint8Array.from(atob(padded), character => character.charCodeAt(0));
      }

      function decodeSignedPayload(fragment) {
        if (!fragment || fragment.length > 30000) throw new Error("Некорректная ссылка.");
        const parts = fragment.split(".");
        if (parts.length !== 2 || !parts[0] || !parts[1]) {
          throw new Error("В ссылке нет подписи.");
        }
        const payload = JSON.parse(new TextDecoder().decode(decodeBase64Url(parts[0])));
        if (typeof payload.destination !== "string" || typeof payload.message !== "string") {
          throw new Error("В ссылке нет контакта или текста.");
        }
        if (!payload.message || payload.message.length > 20000) {
          throw new Error("Текст сообщения имеет неверную длину.");
        }
        return {payload, encodedPayload: parts[0], signature: decodeBase64Url(parts[1])};
      }

      async function verifySignature(encodedPayload, signature) {
        const key = await crypto.subtle.importKey(
          "jwk",
          PUBLIC_KEY_JWK,
          {name: "ECDSA", namedCurve: "P-256"},
          false,
          ["verify"]
        );
        return crypto.subtle.verify(
          {name: "ECDSA", hash: "SHA-256"},
          key,
          signature,
          new TextEncoder().encode(encodedPayload)
        );
      }

      function validateDestination(value) {
        const destination = new URL(value);
        if (destination.protocol !== "https:" || !ALLOWED_HTTPS_HOSTS.has(destination.hostname.toLowerCase())) {
          throw new Error("Этот тип контакта пока не поддерживается.");
        }
        return destination;
      }

      function legacyCopy(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.inset = "0 auto auto -9999px";
        document.body.append(area);
        area.focus();
        area.select();
        area.setSelectionRange(0, text.length);
        const copied = document.execCommand("copy");
        area.remove();
        return copied;
      }

      async function copyAutomatically(text) {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_) {
            // WebKit normally rejects this path because page load is not a user gesture.
          }
        }
        try {
          return legacyCopy(text);
        } catch (_) {
          return false;
        }
      }

      async function copyFromGesture(text) {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_) {
            // Older mobile webviews may still support the selection-based copy command.
          }
        }
        return legacyCopy(text);
      }

      function openDestination(destination) {
        location.replace(destination.href);
      }

      async function initialize() {
        let payload;
        let destination;
        try {
          const signedPayload = decodeSignedPayload(location.hash.slice(1));
          history.replaceState(null, "", location.pathname);
          if (!await verifySignature(signedPayload.encodedPayload, signedPayload.signature)) {
            throw new Error("Подпись сообщения не прошла проверку.");
          }
          payload = signedPayload.payload;
          destination = validateDestination(payload.destination);
        } catch (error) {
          fail(error instanceof Error ? error.message : "Некорректная ссылка.");
          return;
        }

        elements.destinationLabel.textContent = destination.hostname;
        elements.message.value = payload.message;
        elements.openOnly.href = destination.href;

        elements.copyOpen.addEventListener("click", async () => {
          elements.copyOpen.disabled = true;
          elements.status.textContent = "Копируем текст...";
          const copied = await copyFromGesture(payload.message);
          if (copied) {
            elements.status.textContent = "Текст скопирован. Открываем контакт...";
            openDestination(destination);
            return;
          }
          elements.copyOpen.disabled = false;
          elements.status.textContent = "Браузер заблокировал копирование.";
          elements.manual.hidden = false;
          elements.message.focus();
          elements.message.select();
        });

        if (await copyAutomatically(payload.message)) {
          elements.status.textContent = "Текст скопирован. Открываем контакт...";
          openDestination(destination);
          return;
        }

        elements.title.textContent = "Скопировать текст и открыть контакт";
        elements.explanation.textContent = "Нажмите кнопку. Текст скопируется, затем откроется контакт.";
        elements.status.textContent = "Браузер требует подтверждение копирования.";
        elements.actions.hidden = false;
      }

      initialize();
    })();
  </script>
</body>
</html>
